worker_processes 1;

events {
	worker_connections 1024;
}

http {
	include /usr/pkg/etc/nginx/mime.types;

	ssl_ciphers HIGH;

	limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
	limit_req_zone $binary_remote_addr zone=perip_req:10m rate=25r/s;

	map $ssl_server_name $cert_domain {
		default $ssl_server_name;
		"" blip.town;
		"~\.blip\.town$" blip.town;
		"~\.bliptown-staging\.com$" bliptown-staging.com;
	}

	map $host $backend_port {
		default 8080;
		"bliptown-staging.com" 8081;
		"~\.bliptown-staging\.com$" 8081;
		"monit.blip.town" 2812;
		"monit.bliptown-staging.com" 2812;
	}

	add_header Strict-Transport-Security "max-age=2592000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	server {
		listen 80 default_server;
		listen [::]:80 default_server;

		location ~* "(\.php|[\x00-\x1F\x7F])" {
			proxy_pass http://127.0.0.1:9666;
			proxy_set_header X-Forwarded-For $remote_addr;
		}

        location ^~ "/.well-known/acme-challenge/" {
            alias /var/uacme/challenge;
        }

		location "/" {
			return 301 https://$host$request_uri;
		}
	}

	server {
		listen 443 ssl default_server;
		listen [::]:443 ssl default_server;

		ssl_certificate /etc/ssl/$cert_domain/cert.pem;
		ssl_certificate_key /etc/ssl/private/$cert_domain/key.pem;

		error_page 429 @ban;

		location ~* "(\.php|[\x00-\x1F\x7F])" {
			proxy_pass http://127.0.0.1:9666;
			proxy_set_header X-Forwarded-For $remote_addr;
		}

		location / {
			limit_conn perip_conn 100;
			limit_req zone=perip_req burst=50 nodelay;
			limit_req_status 429;

			proxy_pass http://127.0.0.1:$backend_port;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_set_header X-Forwarded-By $server_addr:$server_port;
		}

		location @ban {
			proxy_pass http://127.0.0.1:9666;
			proxy_set_header X-Forwarded-For $remote_addr;
		}
	}
}
