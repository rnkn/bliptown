$ext_if = vioif0

table <bunnycdn> type lpm file "/etc/bunnycdn.txt"
table <bunnycdn_ipv6> type lpm file "/etc/bunnycdn-ipv6.txt"
table <blocklist> type lpm file "/etc/blocklist.txt"
table <rate_limit> type ipset

group "external" on $ext_if {
	pass stateful in final from <bunnycdn>
	pass stateful in final from <bunnycdn_ipv6>

	block in final from <blocklist>
	block out final to <blocklist>
	block in final from <rate_limit>
	block out final from <rate_limit>

	block in final proto tcp to any port 6000-6010

	pass stateful in final family inet6 proto ipv6-icmp all
}

group default {
	pass stateful out final on lo0 proto tcp from any to 127.0.0.1 port 9000 user bliptown
	block return out final on lo0 proto tcp from any to 127.0.0.1 port 9000

	pass stateful out final on lo0 proto tcp from any to 127.0.0.1 port 9001 user bliptown_staging
	block return out final on lo0 proto tcp from any to 127.0.0.1 port 9001

	pass stateful out final on lo0 proto tcp from any to 127.0.0.1 port 9666 user nginx
	block return out final on lo0 proto tcp from any to 127.0.0.1 port 9666

	pass final all
}
