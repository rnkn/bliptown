$ext_if = vioif0

table <bunnycdn> type lpm file "/etc/bunnycdn.txt"
table <bunnycdn_ipv6> type lpm file "/etc/bunnycdn-ipv6.txt"
table <blacklist> type lpm file "/etc/blacklist.txt"
table <rate_limit> type ipset

group "external" on $ext_if {
	pass stateful in final from <bunnycdn>
	pass stateful in final from <bunnycdn_ipv6>

	block in final from <blacklist>
	block out final to <blacklist>
	block in final from <rate_limit>
	block out final from <rate_limit>

	block in final proto tcp to any port 6000-6010

	pass stateful in final family inet6 proto ipv6-icmp all
}

group default {
	pass stateful in final on lo0 proto tcp from any to 127.0.0.1 port 9000 user bliptown
	block in final on lo0 proto tcp from any to 127.0.0.1 port 9000

	pass stateful in final on lo0 proto tcp from any to 127.0.0.1 port 9001 user bliptown_staging
	block in final on lo0 proto tcp from any to 127.0.0.1 port 9001

	pass final all
}
