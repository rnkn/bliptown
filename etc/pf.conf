set skip on lo

block return
pass

pass in on lo0 proto tcp from self to 127.0.0.1 port 9000 user bliptown
block in on lo0 proto tcp from any to 127.0.0.1 port 9000

pass in on lo0 proto tcp from self to 127.0.0.1 port 9001 user bliptown_staging
block in on lo0 proto tcp from any to 127.0.0.1 port 9001

table <bunnycdn> persist file "/etc/bunnycdn.txt"
table <bunnycdn_ipv6> persist file "/etc/bunnycdn-ipv6.txt"
pass in quick on egress from { <bunnycdn> <bunnycdni_ipv6> }

table <pfbadhost> persist file "/etc/pf-badhost.txt"
block in quick on egress from <pfbadhost>
block out quick on egress to <pfbadhost>

table <rate_limit> persist
pass in on egress proto tcp keep state \
	 (max-src-conn 100, max-src-conn-rate 100/10, overload <rate_limit> flush global)
block drop in quick from <rate_limit>

block in on ! lo0 proto tcp to port 6000:6010
block out log proto { tcp udp } user _pbuild

pass in on egress inet6 proto icmp6 keep state
